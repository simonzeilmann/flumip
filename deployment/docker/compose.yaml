# FLUMIP with Docker Compose. See docs/docker.md for the whole procedure:
#
#   ./init-env.sh            # once: writes .env with fresh secrets
#   docker compose build     # builds flumip-local, compiling MIPGEN locally
#   docker compose up -d
#   docker compose run --rm --no-deps flumip fetch-genome hg38
#
# Configuration lives in .env, next to this file.

name: flumip

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${FLUMIP_DB_NAME:-flumip}
      # ⚠️ Read only when the database is first created. Changing it in .env
      # afterwards does not change the database's password; it locks the server
      # out of it.
      POSTGRES_PASSWORD: ${FLUMIP_DB_PASSWORD:?FLUMIP_DB_PASSWORD is not set; run ./init-env.sh first}
      # The role FLUMIP connects as. init-env.sh sets flumip for a new install,
      # and flumip-db-role below creates it, owning the database, when the volume
      # is first initialised. Unset, as in every .env written before, FLUMIP
      # connects as the superuser postgres, as it always did; see "Database
      # role" in docs/docker.md to move such an install over.
      FLUMIP_DB_USER: ${FLUMIP_DB_USER:-postgres}
      FLUMIP_DB_PASSWORD: ${FLUMIP_DB_PASSWORD}
    configs:
      - source: flumip-db-role
        target: /docker-entrypoint-initdb.d/10-flumip-role.sh
    volumes:
      # ⚠️ /var/lib/postgresql, not /var/lib/postgresql/data. postgres:18 keeps
      # its data in /var/lib/postgresql/18/docker, so a volume on .../data would
      # hold nothing and the database would vanish with the container.
      - db:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1: a fresh container runs initdb on a socket-only server
      # before it listens on TCP, and the server connects over TCP.
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    # No ports: only the flumip service talks to it, over the compose network.

  flumip:
    build:
      context: .
      dockerfile: mipgen.Dockerfile
      args:
        FLUMIP_IMAGE: ${FLUMIP_IMAGE:-ghcr.io/simonzeilmann/flumip}
        FLUMIP_VERSION: ${FLUMIP_VERSION:?FLUMIP_VERSION is not set; run ./init-env.sh first}
    # ⚠️ No registry in the name, so `docker push` has nowhere to send it. This
    # image contains MIPGEN, whose licence forbids distributing it.
    image: flumip-local:${FLUMIP_VERSION}
    # tini as PID 1. Cancelling a design kills mipgen and its bwa children; init
    # reaps what that leaves behind, and passes docker stop's SIGTERM on to the
    # server, which shuts down cleanly on it.
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # 127.0.0.1 by default: put a reverse proxy with HTTPS in front (see the
      # README). Docker's own firewall rules bypass ufw, so FLUMIP_BIND=0.0.0.0
      # really does open it to the whole network — do that only on a trusted one.
      - "${FLUMIP_BIND:-127.0.0.1}:${FLUMIP_PORT:-9082}:9082"
    # The FLUMIP_* sign-in settings go straight through from .env, and only the
    # ones that are set: an unset variable must not reach the server as an empty
    # string, which some of them would take as a value. So does
    # FLUMIP_INITIAL_SETTINGS_PASSWORD, which init-env.sh writes for a new
    # install and the server reads only when it first creates its settings.
    env_file:
      - .env
    environment:
      SERVERPOD_DATABASE_HOST: postgres
      SERVERPOD_DATABASE_PORT: "5432"
      SERVERPOD_DATABASE_NAME: ${FLUMIP_DB_NAME:-flumip}
      SERVERPOD_DATABASE_USER: ${FLUMIP_DB_USER:-postgres}
      SERVERPOD_DATABASE_PASSWORD: ${FLUMIP_DB_PASSWORD}
      SERVERPOD_SERVICE_SECRET: ${FLUMIP_SERVICE_SECRET:?FLUMIP_SERVICE_SECRET is not set; run ./init-env.sh first}
    volumes:
      # ⚠️ Only these two. MIPGEN and tools/ live in the image under /opt/flumip,
      # and a volume on /opt/flumip itself would hide them.
      - ${FLUMIP_DATA_DIR:-./data}:/opt/flumip/data
      - ${FLUMIP_PROJECTS_DIR:-./projects}:/opt/flumip/projects

  # Optional: a self-hosted single sign-on provider, for a public instance that
  # has no institutional one to use. Off unless the pocket-id profile is active,
  # which `./init-env.sh --pocket-id <url>` arranges through COMPOSE_PROFILES in
  # .env. See docs/pocket-id.md.
  #
  # ⚠️ No ${VAR:?…} checks in this service. Compose interpolates the whole file
  # whether a profile is active or not, so one would break every install that
  # never asked for Pocket ID.
  pocket-id:
    # Keep in step with deployment/pocket-id.pin; release.yml checks it.
    image: ghcr.io/pocket-id/pocket-id:v2.19.1
    profiles: [pocket-id]
    restart: unless-stopped
    # Its own file, not .env: the flumip service reads all of .env, and this
    # key has no business in that container.
    env_file:
      - pocket-id.env
    ports:
      # 127.0.0.1 only, like FLUMIP: the reverse proxy serves it over HTTPS.
      - "127.0.0.1:${POCKET_ID_PORT:-1411}:1411"
    volumes:
      # The database, holding the users, passkeys and signing keys. ⚠️ Useless
      # without ENCRYPTION_KEY from pocket-id.env; back up the two together.
      - ${POCKET_ID_DATA_DIR:-./pocket-id-data}:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db:

configs:
  # Run by the postgres image once, when it initialises an empty volume, and
  # never again. With FLUMIP_DB_USER set (new installs), it creates that role as
  # an ordinary login, not a superuser, that owns FLUMIP's database: all
  # Serverpod's migrations need, since FLUMIP's create no extensions. It then
  # refuses the superuser postgres on every network connection, so the password
  # in .env, which the flumip container also sees, opens only FLUMIP's own
  # database. `docker compose exec postgres psql -U postgres` still works: it
  # comes in over the local socket, which the image trusts.
  #
  # ⚠️ Sourced by the image's entrypoint, not run: no `exit`, no `set`. $$ is a
  # literal $ to Compose. Needs Docker Compose 2.23.1 or later (configs with
  # inline content).
  flumip-db-role:
    content: |
      if [ "$${FLUMIP_DB_USER:-postgres}" != postgres ]; then
        psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<'SQL'
      \getenv role FLUMIP_DB_USER
      \getenv pw FLUMIP_DB_PASSWORD
      \getenv db POSTGRES_DB
      CREATE ROLE :"role" LOGIN PASSWORD :'pw';
      ALTER DATABASE :"db" OWNER TO :"role";
      SQL
        sed -i '1i host all postgres all reject' "$$PGDATA/pg_hba.conf"
      fi
