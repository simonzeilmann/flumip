name: development build pipeline

on:
  push:
    branches:
      - development

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd flumip_server && flutter pub get
          cd ../flumip_flutter && flutter pub get

      - name: Analyze code
        run: |
          cd flumip_server && dart analyze
          cd ../flumip_flutter && flutter analyze

      - name: Build
        run: |
          cd flumip_server && dart compile exe bin/main.dart
          cd ../flumip_flutter && flutter build web --debug --wasm

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-build

    services:
      # Test database matching flumip_server/config/test.yaml (localhost:9090,
      # db flumip_test, user postgres). POSTGRES_TEST_PASSWORD must equal the
      # `test.database` password inside the PASSWORDS_YAML secret.
      postgres_test:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: flumip_test
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD }}
        ports:
          - 9090:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd flumip_server && flutter pub get
          cd ../flumip_flutter && flutter pub get

      - name: Inject passwords.yaml
        run: |
          echo "${{ secrets.PASSWORDS_YAML }}" > flumip_server/config/passwords.yaml

      - name: Run tests
        run: |
          cd flumip_server && dart test --exclude-tags env
