name: development build pipeline

on:
  push:
    branches:
      - development

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: 'stable'
          
      - name: Print outputs
        shell: bash
        run: |
          echo CACHE-PATH=${{ steps.flutter-action.outputs.CACHE-PATH }}
          echo CACHE-KEY=${{ steps.flutter-action.outputs.CACHE-KEY }}
          echo CHANNEL=${{ steps.flutter-action.outputs.CHANNEL }}
          echo VERSION=${{ steps.flutter-action.outputs.VERSION }}
          echo ARCHITECTURE=${{ steps.flutter-action.outputs.ARCHITECTURE }}
          echo PUB-CACHE-PATH=${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}
          echo PUB-CACHE-KEY=${{ steps.flutter-action.outputs.PUB-CACHE-KEY }}

      - name: Get dependencies
        run: |
          cd flumip_server && flutter pub get
          cd ../flumip_flutter && flutter pub get

      - name: clone serverpod repo and generate files
        run: |
          git clone https://github.com/serverpod/serverpod.git
          cd serverpod
          SERVERPOD_HOME=$(pwd)
          echo $SERVERPOD_HOME
          ./util/pub_get_all
          dart pub global activate --source path tools/serverpod_cli
          serverpod version
          CLI_DIR=SERVERPOD_HOME/tools/serverpod_cli
          CLI=$CLI_DIR/bin/serverpod_cli.dart
          echo "pub get cli"
          cd $CLI_DIR
          dart pub get
          
          pwd
          echo "flumip_server"
          cd /home/runner/work/flumip/flumip/flumip_server
          dart $CLI generate --no-analytics

      - name: Generate serverpod files
        run: |
          cd flumip_server && serverpod generate

      - name: Analyze code
        run: |
          cd flumip_server && dart analyze
          cd ../flumip_flutter && flutter analyze

      - name: Build
        run: |
          cd flumip_server && dart compile exe bin/main.dart
          cd ../flumip_flutter && flutter build web --release

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set Up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Get dependencies
        run: |
          cd flumip_server && dart pub get

      - name: Inject passwords.yaml
        run: |
          echo "${{ secrets.PASSWORDS_YAML }}" > flumip_server/config/passwords.yaml

      - name: Run tests
        run: |
          cd flumip_server && dart test --tags "unit && action"
