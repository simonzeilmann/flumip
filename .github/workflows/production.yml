name: Production build pipeline

on:
  push:
    branches:
      - main

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd flumip_server && flutter pub get
          cd ../flumip_flutter && flutter pub get

      - name: Analyze code
        run: |
          cd flumip_server && flutter analyze
          cd ../flumip_flutter && flutter analyze

      - name: Build
        run: |
          cd flumip_server && dart compile exe bin/main.dart
          cd ../flumip_flutter && flutter build web --release

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-build

    services:
      # Test database matching flumip_server/config/test.yaml (localhost:9090,
      # db flumip_test, user postgres). POSTGRES_TEST_PASSWORD must equal the
      # `test.database` password inside the PASSWORDS_YAML secret.
      postgres_test:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: flumip_test
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD }}
        ports:
          - 9090:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd flumip_server && flutter pub get
          cd ../flumip_flutter && flutter pub get

      - name: Inject passwords.yaml
        run: |
          echo "${{ secrets.PASSWORDS_YAML }}" > flumip_server/config/passwords.yaml

      - name: Run tests
        run: |
          cd flumip_server && dart test --exclude-tags env

      - name: Run Flutter tests
        run: |
          cd flumip_flutter && flutter test

  deploy-production-to-server:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd flumip_server && flutter pub get
          cd ../flumip_flutter && flutter pub get

      - name: Inject passwords.yaml
        run: |
          echo "${{ secrets.PASSWORDS_YAML }}" > flumip_server/config/passwords.yaml

      - name: Extract APP_VERSION
        run: |
          export APP_VERSION=$(grep '^version:' flumip_flutter/pubspec.yaml | awk '{print $2}')
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: Build and inject frontend
        run: |
          cd flumip_flutter && flutter build web --release --wasm --dart-define=APP_VERSION=${{ env.APP_VERSION }} --dart-define=API_URL=${{ vars.PRODUCTION_API_URL }} --dart-define=SITE_TITLE=${{ vars.PRODUCTION_TITLE }} --dart-define=SITE_URL=${{ vars.PRODUCTION_URL }} --output ../flumip_server/web/app

      - name: Build server
        run: |
          cd flumip_server
          mkdir app
          dart compile exe bin/main.dart -o app/server
          cp -r config app/config
          cp -r migrations app/migrations
          cp -r web app/web
          cp -r ../deployment app/deployment

      - name: Transfer app to remote server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          rm: true
          source: "flumip_server/app"
          target: "~/flumip_production"

      - name: Execute remote script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            #!/bin/bash
            docker stop postgres_production || true
            docker rm postgres_production || true
            # postgres:18 matches dev, test, CI and deployment/setup-flumip.sh.
            # The volume mounts at /var/lib/postgresql, NOT .../data: postgres:18
            # sets PGDATA=/var/lib/postgresql/18/docker, so the old path would
            # keep the data in the container layer and lose it on the next
            # `docker rm` here. Matches flumip_server/docker-compose.yaml.
            # NOTE: the existing flumip_production_data volume holds a 16.3 data
            # directory at the old path and must be dumped and restored before
            # this first runs.
            docker run -d --name postgres_production -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PRODUCTION_KEY }} -e POSTGRES_DB=flumip_production -v flumip_production_data:/var/lib/postgresql -p 5432:5432 --restart unless-stopped postgres:18
            rm -rf /var/www/flumip_production
            mv ~/flumip_production/flumip_server/app /var/www/flumip_production
            echo ${{ secrets.USERPWD }} | sudo -S cp /var/www/flumip_production/deployment/flumip_production.service /etc/systemd/system/
            echo ${{ secrets.USERPWD }} | sudo -S systemctl enable flumip_production
            echo ${{ secrets.USERPWD }} | sudo -S systemctl daemon-reload
            echo ${{ secrets.USERPWD }} | sudo -S systemctl restart flumip_production
