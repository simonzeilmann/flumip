name: production build pipeline

on:
  push:
    branches:
      - main

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd flumip_server && flutter pub get
          cd ../flumip_flutter && flutter pub get

      - name: Analyze code
        run: |
          cd flumip_server && flutter analyze
          cd ../flumip_flutter && flutter analyze

      - name: Build
        run: |
          cd flumip_server && dart compile exe bin/main.dart
          cd ../flumip_flutter && flutter build web --release

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set Up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Get dependencies
        run: |
          cd flumip_server && dart pub get

      - name: Inject passwords.yaml
        run: |
          echo "${{ secrets.PASSWORDS_YAML }}" > flumip_server/config/passwords.yaml

      - name: Run tests
        run: |
          cd flumip_server && dart test --tags "unit && action"

  deploy-backend-to-server:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set Up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Get dependencies
        run: |
          cd flumip_server && dart pub get

      - name: Inject passwords.yaml
        run: |
          echo "${{ secrets.PASSWORDS_YAML }}" > flumip_server/config/passwords.yaml

      - name: Build server
        run: |
          cd flumip_server
          mkdir app
          dart compile exe bin/main.dart -o app/server
          cp -r config app/config
          cp -r migrations app/migrations
          cp -r web app/web

      - name: Transfer app to remote server
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          rm: true
          source: "flumip_server/app"
          target: "~/flumip_production/backend"

      - name: Execute remote script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            #!/bin/bash
            docker stop postgres_production || true
            docker rm postgres_production || true
            docker run -d --name postgres_production -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_prod_KEY }} -e POSTGRES_DB=flumip_production -v flumip_production_data:/var/lib/postgresql/data -p 5433:5432 --restart unless-stopped postgres:16.3
            kill $(cat ~/flumip_production/backend_pid.txt) || true
            rm ~/flumip_production/backend_pid.txt || true
            rm -rf /var/www/flumip_production/backend
            mv ~/flumip_production/backend/flumip_server/app /var/www/flumip_production/backend
            cd /var/www/flumip_production/backend
            nohup ./server --mode=production --server-id=production --logging=normal --role=monolith --apply-migrations  > nohup.out 2> nohup.err < /dev/null &
            echo $! > ~/flumip_production/backend_pid.txt

  deploy-frontend-to-server:
    runs-on: ubuntu-latest
    needs: deploy-backend-to-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd flumip_flutter && flutter pub get

      - name: Set api endpoint
        run: |
          sed -i 's/$localhost:8080/api.flumip-production.simonzeilmann.com/' flumip_flutter/lib/main.dart
          sed -i 's/http/https/' flumip_flutter/lib/main.dart

      - name: Build
        run: |
          cd flumip_flutter && flutter build web --release

      - name: Transfer frontend to remote server
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          rm: true
          source: "flumip_flutter/build/web"
          target: "~/flumip_production/frontend"

      - name: Execute remote script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            #!/bin/bash
            kill $(cat ~/flumip_production/frontend_pid.txt) || true
            rm ~/flumip_production/frontend_pid.txt || true
            rm -rf /var/www/flumip_production/frontend
            mv ~/flumip_production/frontend /var/www/flumip_production/frontend
            cd /var/www/flumip_production/frontend/flumip_flutter/build/web
            nohup python -m http.server 8888 > nohup.out 2> nohup.err < /dev/null &
            echo $! > ~/flumip_production/frontend_pid.txt