name: Production build pipeline

on:
  push:
    branches:
      - main

jobs:
  # Checks live in checks.yml so this pipeline cannot drift from the others.
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      web_build_args: --release
    secrets: inherit

  deploy-production-to-server:
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: 'stable'
          flutter-version: '3.47.5'

      - name: Get dependencies
        run: |
          cd flumip_server && flutter pub get
          cd ../flumip_flutter && flutter pub get

      - name: Inject passwords.yaml
        run: |
          echo "${{ secrets.PASSWORDS_YAML }}" > flumip_server/config/passwords.yaml

      - name: Extract APP_VERSION
        run: |
          export APP_VERSION=$(grep '^version:' flumip_flutter/pubspec.yaml | awk '{print $2}')
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: Build and inject frontend
        run: |
          cd flumip_flutter && flutter build web --release --wasm --dart-define=APP_VERSION=${{ env.APP_VERSION }} --dart-define=SITE_TITLE=${{ vars.PRODUCTION_TITLE }} --output ../flumip_server/web/app

      - name: Build server
        run: |
          cd flumip_server
          mkdir app
          # `dart build cli`, not `dart compile exe`. Serverpod 4 pulls in
          # sqlite3 (transitively, via serverpod_database), which ships a
          # native build hook; `dart compile exe` does not run build hooks, so
          # the binary it produces is missing its native libraries and dies at
          # runtime. `dart build cli` emits build/bundle/bin/main alongside
          # build/bundle/lib/, and the executable resolves those libraries
          # relative to itself — so the bundle directory has to travel intact.
          dart build cli --target bin/main.dart --output build
          cp -r build/bundle app/bundle
          cp -r config app/config
          cp -r migrations app/migrations
          cp -r web app/web
          cp -r ../deployment app/deployment

      - name: Transfer app to remote server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          rm: true
          source: "flumip_server/app"
          target: "~/flumip_production"

      - name: Execute remote script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            #!/bin/bash
            docker stop postgres_production || true
            docker rm postgres_production || true
            # postgres:18 matches dev, test, CI and deployment/setup-flumip.sh.
            # The volume mounts at /var/lib/postgresql, NOT .../data: postgres:18
            # sets PGDATA=/var/lib/postgresql/18/docker, so the old path would
            # keep the data in the container layer and lose it on the next
            # `docker rm` here. Matches flumip_server/docker-compose.yaml.
            # NOTE: the existing flumip_production_data volume holds a 16.3 data
            # directory at the old path and must be dumped and restored before
            # this first runs.
            # Published on 127.0.0.1 only: the server runs on this host and
            # connects to localhost, and Docker's own iptables rules bypass ufw,
            # so a bare -p would put the database on the internet. Reach it from
            # elsewhere through an SSH tunnel.
            docker run -d --name postgres_production -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PRODUCTION_KEY }} -e POSTGRES_DB=flumip_production -v flumip_production_data:/var/lib/postgresql -p 127.0.0.1:5432:5432 --restart unless-stopped postgres:18
            rm -rf /var/www/flumip_production
            mv ~/flumip_production/flumip_server/app /var/www/flumip_production
            echo ${{ secrets.USERPWD }} | sudo -S cp /var/www/flumip_production/deployment/flumip_production.service /etc/systemd/system/
            echo ${{ secrets.USERPWD }} | sudo -S systemctl enable flumip_production
            echo ${{ secrets.USERPWD }} | sudo -S systemctl daemon-reload
            echo ${{ secrets.USERPWD }} | sudo -S systemctl restart flumip_production
