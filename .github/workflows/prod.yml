name: prod build pipeline

on:
  push:
    branches:
      - main

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd flumip_server && flutter pub get
          cd ../flumip_flutter && flutter pub get

      - name: Analyze code
        run: |
          cd flumip_server && flutter analyze
          cd ../flumip_flutter && flutter analyze

      - name: Build
        run: |
          cd flumip_server && dart compile exe bin/main.dart
          cd ../flumip_flutter && flutter build web --release

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set Up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Get dependencies
        run: |
          cd flumip_server && dart pub get

      - name: Inject passwords.yaml
        run: |
          echo "${{ secrets.PASSWORDS_YAML }}" > flumip_server/config/passwords.yaml

      - name: Run tests
        run: |
          cd flumip_server && dart test --tags "unit && action"

  deploy-backend-to-server:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Inject passwords.yaml
        run: |
          echo "${{ secrets.PASSWORDS_YAML }}" > flumip_server/config/passwords.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          cd flumip_server
          docker build -f PROD.Dockerfile -t flumip:prod .

      - name: Save Docker image as tar
        run: |
          docker save flumip:prod -o flumip_prod.tar

      - name: Transfer Docker image to remote server
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          rm: true
          source: "flumip_prod.tar"
          target: "~/flumip_prod.tar"

      - name: Execute remote script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            #!/bin/bash
            docker stop flumip_prod || true
            docker rm flumip_prod || true
            docker image rm flumip:prod || true
            docker load -i ~/flumip_prod.tar/flumip_prod.tar
            docker stop postgres_prod || true
            docker rm postgres_prod || true
            docker run -d --name postgres_prod -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PROD_KEY }} -e POSTGRES_DB=flumip -p 5432:5432 --restart unless-stopped postgres:latest
            docker run -d --name flumip_prod -e runmode=production --network host -p 9080:8080 -p 9081:8081 -p 9082:8082 --restart unless-stopped flumip:prod

  deploy-frontend-to-server:
    runs-on: ubuntu-latest
    needs: deploy-backend-to-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd flumip_flutter && flutter pub get

      - name: Set api port
        run: |
          sed -i "s/localhost:8080/localhost:9080/" flumip_flutter/lib/main.dart

      - name: Build
        run: |
          cd flumip_flutter && flutter build web --release

      - name: Transfer frontend to remote server
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          rm: true
          source: "flumip_flutter/build/web"
          target: "~/flumip_prod/frontend"

      - name: Execute remote script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            #!/bin/bash
            kill $(cat ~/prod_pid.txt) || true
            rm ~/prod_pid.txt || true
            rm -rf /var/www/flumip_prod/frontend
            mv ~/flumip_prod/frontend /var/www/flumip_prod/frontend
            cd /var/www/flumip_prod/frontend
            nohup python -m http.server 8888 > nohup.out 2> nohup.err < /dev/null &
            echo $! > ~/prod_pid.txt