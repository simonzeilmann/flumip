name: Build and Deploy Docker on Prohost

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          cd flumip_server
          docker build -t flumip:latest .

      - name: Save Docker image as tar
        run: |
          docker save flumip:latest -o flumip.tar

      - name: Transfer Docker image to remote server
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          source: "flumip.tar"
          target: "~/flumip.tar"

      - name: Execute remote script
        uses: appleboy/ssh-action@v0.1.1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            #!/bin/bash
            docker stop flumip || true
            docker rm flumip || true
            docker image rm flumip:latest || true
            docker load -i ~/flumip.tar/flumip.tar
            docker stop postgres || true
            docker rm postgres || true
            docker run -d --name postgres -e POSTGRES_PASSWORD=thisisanunsafepassword -e POSTGRES_DB=serverpod -p 5432:5432 postgres:latest
            docker run -d --name flumip --link postgres:postgres -e SERVERPOD_DATABASE_PASSWORD='thisisanunsafepassword' -p 8080:8080 flumip:latest