name: Build and Deploy Docker on Prohost

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t flumip:latest .

      - name: Save Docker image as tar
        run: |
          docker save flumip:latest -o flumip.tar

      - name: Transfer Docker image to remote server
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          source: "flumip.tar"
          target: "~/flumip.tar"

      - name: Execute remote script
        uses: appleboy/ssh-action@v0.1.1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            #!/bin/bash
            docker load -i ~/flumip.tar
            docker stop flumip || true
            docker rm flumip || true
            docker stop postgres || true
            docker run -d --name postgres -e POSTGRES_PASSWORD=mysecretpassword -e POSTGRES_DB=flumip -p 5432:5432 postgres:latest
            docker run -d --name flumip --link postgres:postgres -p 8080:8080 flumip:latest