name: Release build

# Publishes the build tarball that deployment/setup-flumip.sh downloads by
# default (https://github.com/<repo>/releases/latest/download/flumip-build.tar.gz).
#
# Like the staging/production pipelines, this build is host-agnostic: the
# frontend derives its API and site URLs from the page origin at runtime (see
# flumip_flutter/lib/api_config.dart), and the web server answers the API under
# /api on its own port. That is what lets one tarball be installed on any
# machine, behind any reverse proxy.
#
# Single sign-on is configured at runtime — in the Settings tab or through the
# environment file the systemd units read (see docs/authentication.md) — so it
# needs no --dart-define here. Do not add one: a compile-time OIDC setting would
# make this tarball host-specific again, which is the whole thing it avoids.
#
# Cut a release by pushing a tag:  git tag v0.7.0 && git push origin v0.7.0
# The tag must match `version:` in both pubspecs, or the job fails before
# building: the footer shows the pubspec version on every other build.
# Run it manually (workflow_dispatch) to test the job: the tarball is uploaded
# as a workflow artifact instead of being published as a release.
#
# A release also publishes the Docker image ghcr.io/<owner>/flumip (the `image`
# job) and flumip-docker.tar.gz, the compose files that install it. ⚠️ The image
# contains no MIPGEN: its licence forbids redistributing it, so the compose file
# compiles it on the user's own machine (deployment/docker/mipgen.Dockerfile).
# The image job builds that local image too, to test it, and never pushes it.
# Nothing is published unless the tarball and the image both built and passed.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The same gate every deploy pipeline has. Without it a tag publishes
  # whatever it points at, checked or not.
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      web_build_args: --release --wasm
    secrets: inherit

  release:
    runs-on: ubuntu-latest
    needs: checks
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'

      - name: Get dependencies
        run: |
          cd flumip_server && flutter pub get
          cd ../flumip_flutter && flutter pub get

      - name: Determine version
        id: version
        run: |
          APP_VERSION="$(grep '^version:' flumip_flutter/pubspec.yaml | awk '{print $2}')"
          SERVER_VERSION="$(grep '^version:' flumip_server/pubspec.yaml | awk '{print $2}')"
          if [ "$APP_VERSION" != "$SERVER_VERSION" ]; then
            echo "::error::flumip_flutter is $APP_VERSION but flumip_server is $SERVER_VERSION."
            exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$APP_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $APP_VERSION in the pubspecs."
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        run: |
          cd flumip_flutter
          flutter build web --release --wasm \
            --dart-define=APP_VERSION=${{ env.APP_VERSION }} \
            --dart-define=SITE_TITLE=FLUMIP \
            --output ../flumip_server/web/app

      - name: Build server
        run: |
          cd flumip_server
          mkdir app
          # `dart build cli`, not `dart compile exe`. Serverpod 4 pulls in
          # sqlite3 (transitively, via serverpod_database), which ships a
          # native build hook; `dart compile exe` does not run build hooks, so
          # the binary it produces is missing its native libraries and dies at
          # runtime. `dart build cli` emits build/bundle/bin/main alongside
          # build/bundle/lib/, and the executable resolves those libraries
          # relative to itself — so the bundle directory has to travel intact.
          dart build cli --target bin/main.dart --output build
          cp -r build/bundle app/bundle
          cp -r config app/config
          cp -r migrations app/migrations
          cp -r web app/web
          cp -r ../deployment app/deployment
          # MIT requires the notice to travel with every copy, and this is one.
          cp ../LICENSE app/LICENSE

      - name: Pack build
        run: |
          cd flumip_server
          # passwords.yaml is gitignored and never injected in this workflow, but
          # fail loudly rather than ship secrets if that ever changes.
          if [ -e app/config/passwords.yaml ]; then
            echo "::error::app/config/passwords.yaml is present; refusing to publish it."
            exit 1
          fi
          tar -czf flumip-build.tar.gz -C app .
          sha256sum flumip-build.tar.gz > flumip-build.tar.gz.sha256
          # setup-flumip.sh rejects an archive without the bundled executable.
          tar -tzf flumip-build.tar.gz | grep -E '(^|/)bundle/bin/main$' >/dev/null

      - name: Pack Docker install files
        run: |
          # What a Docker install needs on the host: the compose file, the local
          # MIPGEN build and the .env template, pinned to this release's image.
          # entrypoint.sh and production.yaml are not here; they are in the image.
          mkdir -p docker-pkg/flumip-docker
          cd docker-pkg/flumip-docker
          cp ../../deployment/docker/compose.yaml ../../deployment/docker/mipgen.Dockerfile \
             ../../deployment/docker/.env.example ../../deployment/docker/init-env.sh \
             ../../deployment/docker/.dockerignore .
          sed -i "s/^FLUMIP_VERSION=.*/FLUMIP_VERSION=${{ env.APP_VERSION }}/" .env.example
          grep -x "FLUMIP_VERSION=${{ env.APP_VERSION }}" .env.example >/dev/null
          cd ..
          tar -czf ../flumip_server/flumip-docker.tar.gz flumip-docker
          cd ../flumip_server
          sha256sum flumip-docker.tar.gz > flumip-docker.tar.gz.sha256

      # Every run, not only manual ones: the image and publish jobs below take
      # the build from here rather than building it again.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flumip-build
          path: |
            flumip_server/flumip-build.tar.gz
            flumip_server/flumip-build.tar.gz.sha256
            flumip_server/flumip-docker.tar.gz
            flumip_server/flumip-docker.tar.gz.sha256

  # The Docker image, made from the tarball above rather than a second build of
  # the sources, so it carries exactly the bits the release does.
  image:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    env:
      APP_VERSION: ${{ needs.release.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download the release build
        uses: actions/download-artifact@v4
        with:
          name: flumip-build

      - name: Name the image
        run: |
          # ghcr.io wants the owner in lower case.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flumip" >> "$GITHUB_ENV"

      - name: Build the image
        run: |
          mkdir dist
          tar -xzf flumip-build.tar.gz -C dist
          # --builder default, the plain docker driver: it loads the result into
          # the local image store, where the MIPGEN build below has to find it.
          docker buildx build --builder default --load \
            --build-arg APP_SOURCE=release-tarball \
            --build-context release-tarball=./dist \
            --label org.opencontainers.image.version="$APP_VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$IMAGE:$APP_VERSION" .

      - name: Smoke test
        run: |
          # Nothing that must not ship, and everything that must.
          docker run --rm --entrypoint sh "$IMAGE:$APP_VERSION" -c '
            set -e
            test ! -e config/passwords.yaml
            test ! -e /opt/flumip/MIPGEN
            test -x bundle/bin/main
            test -f web/app/index.html
            test -f config/production.yaml
            test -x /opt/flumip/tools/mipgen-trf'
          # The image as an install actually runs it: MIPGEN compiled on top,
          # then the container's own self-test. ⚠️ flumip-local is never pushed.
          docker buildx build --builder default --load \
            -f deployment/docker/mipgen.Dockerfile \
            --build-arg FLUMIP_IMAGE="$IMAGE" \
            --build-arg FLUMIP_VERSION="$APP_VERSION" \
            -t flumip-local:ci deployment/docker
          docker run --rm flumip-local:ci check

      - name: Push the image
        if: github.ref_type == 'tag'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          MINOR="${APP_VERSION%.*}"
          docker tag "$IMAGE:$APP_VERSION" "$IMAGE:$MINOR"
          docker tag "$IMAGE:$APP_VERSION" "$IMAGE:latest"
          for tag in "$APP_VERSION" "$MINOR" latest; do
            docker push "$IMAGE:$tag"
          done

  publish:
    runs-on: ubuntu-latest
    needs: [release, image]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.release.outputs.version }}

    steps:
      - name: Download the release build
        uses: actions/download-artifact@v4
        with:
          name: flumip-build
          path: flumip_server

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: FLUMIP ${{ env.APP_VERSION }}
          generate_release_notes: true
          files: |
            flumip_server/flumip-build.tar.gz
            flumip_server/flumip-build.tar.gz.sha256
            flumip_server/flumip-docker.tar.gz
            flumip_server/flumip-docker.tar.gz.sha256
          body: |
            Install a FLUMIP server (see the README for the details):

            ```bash
            mkdir flumip && cd flumip
            curl -fLO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/flumip-build.tar.gz
            tar -xzf flumip-build.tar.gz

            # 1. dependencies, MIPGEN and the hg38 reference data
            ./deployment/setup-mipgen.sh --download hg38

            # 2. the app itself
            ./deployment/setup-flumip.sh --file flumip-build.tar.gz --host your.hostname --yes
            ```

            To update an existing install, unpack this release into a fresh
            directory and re-run step 2 without `--host`; add `--staging` for a
            staging install.

            Or with Docker (see docs/docker.md; MIPGEN is compiled on your machine):

            ```bash
            curl -fL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/flumip-docker.tar.gz | tar -xz
            cd flumip-docker
            ./init-env.sh
            docker compose build && docker compose up -d
            docker compose run --rm --no-deps flumip fetch-genome hg38
            ```
