name: checks

# The single definition of "is this code OK". development.yml, staging.yml,
# production.yml and pr.yml all call this, so the steps cannot drift apart.
#
# That drift is not hypothetical: these steps were previously copied into three
# workflows, and when only development.yml was updated to `dart analyze` the
# staging and production pipelines became undeployable for weeks (PR #24).
# Change a check here, once, and every pipeline picks it up.

on:
  workflow_call:
    inputs:
      web_build_args:
        description: >-
          Flags for `flutter build web` in the build step. The deploy pipelines
          each build the frontend differently: development --debug --wasm,
          staging --debug, production --release.
        required: true
        type: string
      run_tests:
        description: >-
          Whether to run the unit-test job. Every push pipeline leaves it on.
          pr.yml turns it off only for a pull request from a fork, where the
          database secrets the job needs are not available.
        required: false
        default: true
        type: boolean

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      # ⚠️ Pinned, not bare `stable`. Serverpod 4 requires Flutter >=3.44.4, and
      # an unpinned SDK means the formatter and analyzer drift under the repo
      # between runs. Keep this in step with the sdk constraints in the three
      # pubspec.yaml files.
      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'

      # Before `pub get`, because formatting is syntactic and needs no packages —
      # so a reflow-only failure comes back in seconds rather than after a
      # dependency resolve.
      #
      # ⚠️ Generated code is excluded, and has to be. `serverpod generate` does
      # not emit `dart format` output, so formatting `lib/src/generated` or the
      # generated test tools would be undone by the next generate and turn this
      # check red on a commit nobody wrote. `flumip_client` is generated in its
      # entirety and is therefore not checked at all.
      #
      # The Flutter version is pinned above, so the formatter and the analyzer
      # are the same ones every developer runs locally. That pin is the fix for
      # the hazard this comment used to describe: on bare `channel: stable` a
      # Dart release could change formatting, or add a diagnostic, and turn
      # every pipeline red on code nobody had touched — which is exactly how
      # `unawaited_return_in_try_block` arrived with Dart 3.13 and left CI
      # failing. Bump the pin deliberately, run the two commands below, and
      # commit the result.
      - name: Check formatting
        run: |
          cd flumip_flutter
          dart format --output=none --set-exit-if-changed lib test
          cd ../flumip_server
          dart format --output=none --set-exit-if-changed $(
            find lib bin test -name '*.dart' \
              -not -path 'lib/src/generated/*' \
              -not -path 'test/integration/test_tools/*'
          )

      - name: Get dependencies
        run: |
          cd flumip_server && flutter pub get
          cd ../flumip_flutter && flutter pub get

      - name: Analyze code
        run: |
          # dart analyze, not flutter analyze, for the server package: it is a
          # plain Dart package with no Flutter dependency, so dart analyze is
          # the matching tool and needs no Flutter SDK resolution. Mirrored by
          # the "Lint" task in .vscode/tasks.json.
          #
          # This used to be justified by "two deliberate deprecated_member_use
          # infos in project_service.dart, non-fatal to dart analyze but fatal
          # to flutter analyze". That stopped being true once DemoModeCleanup
          # moved to the generated future-call API, and the claim outlived it in
          # three places. Both analyzers are clean now; keep them clean.
          cd flumip_server && dart analyze
          cd ../flumip_flutter && flutter analyze

      # `dart build cli`, not `dart compile exe`: Serverpod 4 brings in a
      # transitive sqlite3 with a native build hook, which `dart compile exe`
      # cannot bundle. Writes into the already-gitignored build/ directory.
      - name: Build
        run: |
          cd flumip_server && dart build cli --target bin/main.dart --output build
          cd ../flumip_flutter && flutter build web ${{ inputs.web_build_args }}

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: ${{ inputs.run_tests }}

    services:
      # Test database matching flumip_server/config/test.yaml (localhost:9090,
      # db flumip_test, user postgres). POSTGRES_TEST_PASSWORD must equal the
      # `test.database` password inside the PASSWORDS_YAML secret.
      postgres_test:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: flumip_test
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD }}
        ports:
          - 9090:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'

      - name: Get dependencies
        run: |
          cd flumip_server && flutter pub get
          cd ../flumip_flutter && flutter pub get

      - name: Inject passwords.yaml
        run: |
          echo "${{ secrets.PASSWORDS_YAML }}" > flumip_server/config/passwords.yaml

      - name: Run tests
        run: |
          cd flumip_server && dart test --exclude-tags env

  # Separate from unit-tests, and deliberately not gated on `run_tests`.
  #
  # The Flutter tests need neither a database nor passwords.yaml, so they can run
  # on a pull request from a fork and they finish in seconds. Leaving them inside
  # unit-tests meant pr.yml (which passes run_tests: false for fast feedback)
  # skipped them entirely — so the auth controller tests would never have guarded
  # a pull request.
  flutter-tests:
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'

      - name: Get dependencies
        run: cd flumip_flutter && flutter pub get

      - name: Run Flutter tests
        run: cd flumip_flutter && flutter test
