name: Staging build pipeline

on:
  push:
    branches:
      - staging

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd flumip_server && flutter pub get
          cd ../flumip_flutter && flutter pub get

      - name: Analyze code
        run: |
          cd flumip_server && flutter analyze
          cd ../flumip_flutter && flutter analyze

      - name: Build
        run: |
          cd flumip_server && dart compile exe bin/main.dart
          cd ../flumip_flutter && flutter build web --debug

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd flumip_server && flutter pub get
          cd ../flumip_flutter && flutter pub get

      - name: Inject passwords.yaml
        run: |
          echo "${{ secrets.PASSWORDS_YAML }}" > flumip_server/config/passwords.yaml

      - name: Run tests
        run: |
          cd flumip_server && dart test --tags "unit && action"

  deploy-staging-to-server:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd flumip_server && flutter pub get
          cd ../flumip_flutter && flutter pub get

      - name: Inject passwords.yaml
        run: |
          echo "${{ secrets.PASSWORDS_YAML }}" > flumip_server/config/passwords.yaml

      - name: Set api endpoint and website name
        run: |
          sed -i 's/$localhost:8080/api.flumip-staging.simonzeilmann.com/' flumip_flutter/lib/main.dart
          sed -i 's/http/https/' flumip_flutter/lib/main.dart
          sed -i 's/Flumip Development/Flumip Staging/' flumip_flutter/lib/main.dart
          sed -i 's/http:/https:/' flumip_flutter/lib/project/project_tile.dart
          sed -i 's/localhost:8082/app.flumip-staging.simonzeilmann.com/' flumip_flutter/lib/project/project_tile.dart

      - name: Build and inject frontend
        run: |
          cd flumip_flutter && flutter build web --debug --wasm --output ../flumip_server/web/app

      - name: Build server
        run: |
          cd flumip_server
          mkdir app
          dart compile exe bin/main.dart -o app/server
          cp -r config app/config
          cp -r migrations app/migrations
          cp -r web app/web
          cp -r ../deployment app/deployment

      - name: Transfer app to remote server
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          rm: true
          source: "flumip_server/app"
          target: "~/flumip_staging"

      - name: Execute remote script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            #!/bin/bash
            docker stop postgres_staging || true
            docker rm postgres_staging || true
            docker run -d --name postgres_staging -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_STAGING_KEY }} -e POSTGRES_DB=flumip_staging -v flumip_staging_data:/var/lib/postgresql/data -p 5433:5432 --restart unless-stopped postgres:16.3
            rm -rf /var/www/flumip_staging
            mv ~/flumip_staging/flumip_server/app /var/www/flumip_staging
            sudo cp ~/flumip_staging/flumip_server/app/deployment/flumip_staging.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl restart flumip_staging
