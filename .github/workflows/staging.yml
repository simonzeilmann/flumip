name: Staging build pipeline

on:
  push:
    branches:
      - staging

jobs:
  # Checks live in checks.yml so this pipeline cannot drift from the others.
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      web_build_args: --debug
    secrets: inherit

  deploy-staging-to-server:
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd flumip_server && flutter pub get
          cd ../flumip_flutter && flutter pub get

      - name: Inject passwords.yaml
        run: |
          echo "${{ secrets.PASSWORDS_YAML }}" > flumip_server/config/passwords.yaml

      - name: Extract APP_VERSION
        run: |
          export APP_VERSION=$(grep '^version:' flumip_flutter/pubspec.yaml | awk '{print $2}')
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: Build and inject frontend
        run: |
          cd flumip_flutter && flutter build web --debug --wasm --dart-define=APP_VERSION=${{ env.APP_VERSION }} --dart-define=API_URL=${{ vars.STAGING_API_URL }} --dart-define=SITE_TITLE=${{ vars.STAGING_TITLE }} --dart-define=SITE_URL=${{ vars.STAGING_URL }} --output ../flumip_server/web/app

      - name: Build server
        run: |
          cd flumip_server
          mkdir app
          dart compile exe bin/main.dart -o app/server
          cp -r config app/config
          cp -r migrations app/migrations
          cp -r web app/web
          cp -r ../deployment app/deployment

      - name: Transfer app to remote server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          rm: true
          source: "flumip_server/app"
          target: "~/flumip_staging"

      - name: Execute remote script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            #!/bin/bash
            docker stop postgres_staging || true
            docker rm postgres_staging || true
            # postgres:18 matches dev, test, CI and deployment/setup-flumip.sh.
            # The volume mounts at /var/lib/postgresql, NOT .../data: postgres:18
            # sets PGDATA=/var/lib/postgresql/18/docker, so the old path would
            # keep the data in the container layer and lose it on the next
            # `docker rm` here. Matches flumip_server/docker-compose.yaml.
            # NOTE: the existing flumip_staging_data volume holds a 16.3 data
            # directory at the old path and must be dumped and restored before
            # this first runs.
            docker run -d --name postgres_staging -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_STAGING_KEY }} -e POSTGRES_DB=flumip_staging -v flumip_staging_data:/var/lib/postgresql -p 5433:5432 --restart unless-stopped postgres:18
            rm -rf /var/www/flumip_staging
            mv ~/flumip_staging/flumip_server/app /var/www/flumip_staging
            echo ${{ secrets.USERPWD }} | sudo -S cp /var/www/flumip_staging/deployment/flumip_staging.service /etc/systemd/system/
            echo ${{ secrets.USERPWD }} | sudo -S systemctl enable flumip_staging
            echo ${{ secrets.USERPWD }} | sudo -S systemctl daemon-reload
            echo ${{ secrets.USERPWD }} | sudo -S systemctl restart flumip_staging
