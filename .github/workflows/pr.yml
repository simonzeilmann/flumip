name: PR checks

# Item 7: before this existed every workflow was push-only, so pull requests got
# no checks at all and problems only surfaced after landing on development.
# PRs #22, #23 and #24 all merged unvalidated — and #24 was itself a CI bug that
# a run of these checks would have caught.

on:
  pull_request:
    branches:
      - development
      - staging
      - main

permissions:
  contents: read

# A new push to a PR makes the in-flight run pointless.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    # Same definition the push pipelines use, so a green PR means something.
    uses: ./.github/workflows/checks.yml
    with:
      # Matches development.yml: development is the usual base, so a PR build
      # should predict the run that happens right after the merge, --wasm
      # included.
      web_build_args: --debug --wasm --pwa-strategy=none
      # Run the test suite on PRs from this repository, and skip it on PRs from
      # a fork.
      #
      # The test job needs POSTGRES_TEST_PASSWORD and PASSWORDS_YAML. A
      # `pull_request` event from a fork gets no secrets, so there the job cannot
      # work and would fail on a database it can never authenticate against —
      # a red check that says nothing about the contributor's code. A PR from a
      # branch in this repository does get them, which is how every PR here is
      # actually opened.
      #
      # It was previously `false` unconditionally, for fast feedback and because
      # of that fork case. The cost was that the backend suite never ran until
      # after the merge — which undercuts the reason this workflow exists, since
      # PRs #22, #23 and #24 all merged unvalidated. A minute of Postgres is
      # worth more than a minute of latency.
      run_tests: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    secrets: inherit
