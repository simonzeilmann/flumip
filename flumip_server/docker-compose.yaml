services:
  # Development services
  postgres:
    image: postgres:18
    ports:
      - '8090:5432'
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: flumip
      POSTGRES_PASSWORD: "Ts9sUjpsxo_I4VGCOcw_UrF3gPrInFqG"
    volumes:
      - flumip_data:/var/lib/postgresql
    profiles:
      - '' # Default profile
      - dev
  redis:
    image: redis:8
    ports:
      - '8091:6379'
    restart: unless-stopped
    command: redis-server --requirepass "lA8abCY8kEJkisCro2UQ38KHooZrurO_"
    environment:
      - REDIS_REPLICATION_MODE=master
    profiles:
      - '' # Default profile
      - dev

  # Test services
  postgres_test:
    image: postgres:18
    ports:
      - '9090:5432'
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: flumip_test
      POSTGRES_PASSWORD: "zxW_YBwuziG0k5ySRDCXfvWI7EsgSVUo"
    volumes:
      - flumip_test_data:/var/lib/postgresql
    profiles:
      - '' # Default profile
      - test
  redis_test:
    image: redis:8
    ports:
      - '9091:6379'
    restart: unless-stopped
    command: redis-server --requirepass "vqJmHdTHMvifg3bjLY3_Y7uunqmvrnRm"
    environment:
      - REDIS_REPLICATION_MODE=master
    profiles:
      - '' # Default profile
      - test

  # A stand-in OpenID Connect provider, for developing against single sign-on
  # without a real identity provider. Deliberately NOT in the default profile:
  # it is a development tool, and nothing in the test suite needs it — the
  # backend tests drive AuthRuntime directly with a fake HTTP client.
  #
  #   docker compose --profile auth up -d mock_oidc
  #   ./tool/dev-auth.sh enable
  #
  # It serves a login form rather than auto-approving, which is the point: in a
  # browser you type any username and are signed in as that user, so alice, bob
  # and an admin need no configuration between them.
  #
  # The issuer is derived from the request host, so it is
  # http://localhost:9999/default — the `/default` matters, and omitting it
  # yields a discovery document whose `issuer` will not match.
  mock_oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.11
    ports:
      - '9999:8080'
    restart: unless-stopped
    profiles:
      - auth

volumes:
  flumip_data:
  flumip_test_data:
