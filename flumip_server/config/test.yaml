# This is the configuration file for your test environment.
# All ports are set to zero in this file which makes the server find the next available port.
# This is needed to enable running tests concurrently. To set up your server, you will
# need to add the name of the database you are connecting to and the user name.
# The password for the database is stored in the config/passwords.yaml.
#
# When running your server locally, the server ports are the same as the public
# facing ports.

# Configuration for the main API test server.
apiServer:
  port: 0
  publicHost: localhost
  publicPort: 0
  publicScheme: http

# Configuration for the Insights test server.
insightsServer:
  port: 0
  publicHost: localhost
  publicPort: 0
  publicScheme: http

# Configuration for the web test server.
webServer:
  port: 0
  publicHost: localhost
  publicPort: 0
  publicScheme: http

# This is the database setup for your test server.
database:
  host: localhost
  port: 9090
  name: flumip_test
  user: postgres

# This is the setup for your Redis test instance.
redis:
  enabled: false
  host: localhost
  port: 9091

sessionLogs:
  persistentEnabled: true
  consoleEnabled: true

# The largest request body the **API** server will accept, in bytes. This is the
# framework default stated explicitly, not a change.
#
# ⚠️ It applies to the API server only. The web server's routes read their own
# bodies, so `SnpUploadRoute` — where the request body *is* a multi-gigabyte VCF
# streamed to disk — is not bounded by this. Its cap is
# `SnpService.maxImportBytes`, enforced via `request.read(maxLength:)`. Changing
# this number will not let larger SNP sets be uploaded, and lowering it will not
# stop them.
maxRequestSize: 524288
