# Configuration for the staging environment, deployed by
# .github/workflows/staging.yml. It mirrors production as closely as possible
# and is where a change is tested before it is promoted.
#
# TLS is terminated by a reverse proxy in front of the web port; see
# "HTTPS and the reverse proxy" in the top-level README.

# The API server. Serverpod always starts it, but nothing reaches it directly:
# the web server answers the API under /api on its own port (ApiRoute), so an
# install is one origin. Keep this port off any proxy and firewall it.
apiServer:
  port: 8090
  publicHost: localhost
  publicPort: 8090
  publicScheme: http

# Configuration for the Insights server.
insightsServer:
  port: 8091
  publicHost: insights.flumip-staging.simonzeilmann.com
  publicPort: 443
  publicScheme: https

# Configuration for the web server.
webServer:
  port: 8092
  publicHost: app.flumip-staging.simonzeilmann.com
  publicPort: 443
  publicScheme: https

# The PostgreSQL database. The password is in config/passwords.yaml.
database:
  host: db.flumip-staging.simonzeilmann.com
  port: 5433
  name: flumip_staging
  user: postgres
  requireSsl: false

# Redis is not used. Serverpod reads this block regardless, so it stays,
# disabled; see "Redis: seam-ready, not enabled" in HANDOFF.md.
redis:
  enabled: false
  host: redis.private-staging.examplepod.com
  port: 6379

# The largest request body the **API** server will accept, in bytes. This is the
# framework default stated explicitly, not a change.
#
# ⚠️ It applies to the API server only. The web server's routes read their own
# bodies, so `SnpUploadRoute` — where the request body *is* a multi-gigabyte VCF
# streamed to disk — is not bounded by this. Its cap is
# `SnpService.maxImportBytes`, enforced via `request.read(maxLength:)`. Changing
# this number will not let larger SNP sets be uploaded, and lowering it will not
# stop them.
maxRequestSize: 524288
