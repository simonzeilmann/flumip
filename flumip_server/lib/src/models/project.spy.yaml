class: Project
table: project
fields:
  name: String
  description: String?
  created: DateTime, default=now
  owner: int?
  department: int?
  genes: List<String>?
  geneFileCreated: bool?
  bedFileCreated: bool?
  active: bool?
  pid: int?
  size: int?
  emailNotification: bool?
  fasta: int?
  snp: int?
  ref: int?
  options: List<String>?
  started: DateTime?
  completedIn: Duration?
  error: String?
  cleanup: bool?